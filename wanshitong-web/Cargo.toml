[package]
name = "wanshitong-web"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
bytesize = "2.3.1"
include_dir = "0.7.4"
jiff.workspace = true
mime_guess = "2.0.5"
serde.workspace = true
serde_json = "1.0.149"
form_urlencoded = "1.2.2"
# Pinned exactly: topcoat is pre-1.0 and breaks its API in most minor releases.
# static/topcoat-runtime@<version>.js is the runtime crate's browser/dist/index.js;
# replace it when changing this version.
topcoat = { version = "=0.9.0", default-features = false, features = [
  "alpine-ajax",
  # Needed alongside "runtime" (it fails to compile without it), though the
  # asset bundle itself is unused.
  "asset",
  "cookie",
  "discover",
  "multipart",
  "router",
  "runtime",
  "tailwind",
  "tower",
  "ui",
  "view",
  "websocket",
] }
tokio = { workspace = true, features = ["time"] }
toml = "0.9.10"
# Gzips the vendored Scalar bundle for the API reference; see `src/api_docs.rs`.
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2"
uuid.workspace = true

wanshitong-api = { path = "../wanshitong-api" }
wanshitong-app = { path = "../wanshitong-app" }

[build-dependencies]
topcoat = { version = "=0.9.0", default-features = false, features = ["tailwind"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wanshitong-client = { path = "../wanshitong-client" }
