[package]
name = "wanshitong-app"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

# `corpus` builds the last-resort probe for `wanshitong_app::corpus`, for
# scoring the heuristics against a corpus of releases. Not built otherwise,
# e.g. for the package.
[features]
corpus = []

[dependencies]
anyhow.workspace = true
error-stack.workspace = true
async-trait.workspace = true
dashmap = "6.1.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.31"
http = "1"
http-cache-semantics = "2.1.0"
http-cache-reqwest.workspace = true
infer = "0.19.0"
jiff.workspace = true
mime_guess = "2.0.5"
notify = { version = "8", default-features = false }
regex.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
toml = "0.9.10"
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true

ffprobe-types.path = "../ffprobe-types"
wanshitong-core.path = "../wanshitong-core"

[dev-dependencies]
# `Jail`, for tests that set the environment the config is read from.
figment = { version = "0.10.19", features = ["test"] }
http-cache.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
